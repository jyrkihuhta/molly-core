name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (pure Rust)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (pure Rust)
        run: cargo test --all-targets

      - name: Doc tests
        run: cargo test --doc

      # The `python` feature pulls in PyO3 (extension-module), which links
      # without libpython, so it builds without a Python toolchain here. Build
      # and lint it so PyO3 API drift is caught as a required check.
      - name: Build the `python` feature
        run: cargo build --features python

      - name: Clippy (`python` feature)
        run: cargo clippy --features python -- -D warnings

  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86.0
      - name: Build on MSRV
        run: cargo build
